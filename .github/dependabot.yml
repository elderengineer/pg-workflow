version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    # Revisit when ts-jest and typescript-eslint support TypeScript 7
    # (ts-jest@29 needs typescript <7, typescript-eslint@8 needs <6.1).
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
