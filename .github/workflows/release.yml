name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: build, test, publish to GitHub
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pgworkflow
          POSTGRES_PASSWORD: pgworkflow
          POSTGRES_DB: pgworkflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgworkflow -d pgworkflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_URL: postgres://pgworkflow:pgworkflow@localhost:5432/pgworkflow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run test:integration
      - name: Pack
        run: npm pack
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --registry https://npm.pkg.github.com/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            elderengineer-pg-workflow-*.tgz

  publish-npmjs:
    name: build, test, publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pgworkflow
          POSTGRES_PASSWORD: pgworkflow
          POSTGRES_DB: pgworkflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgworkflow -d pgworkflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_URL: postgres://pgworkflow:pgworkflow@localhost:5432/pgworkflow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run test:integration
      - name: Publish to npm (trusted publishing, OIDC)
        run: npm publish --access public
